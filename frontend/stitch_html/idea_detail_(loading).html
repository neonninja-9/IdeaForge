<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>IdeaForge - Loading Idea</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#6c3ce0',
                            light: '#8b5cf6',
                            dark: '#5b21b6'
                        },
                        surface: {
                            DEFAULT: '#ffffff',
                            alt: '#fdfdfb',
                            dark: '#0a0a0a'
                        },
                        foreground: {
                            DEFAULT: '#0a0a0a',
                            mid: '#555555',
                            muted: '#aaaaaa'
                        },
                        border: {
                            DEFAULT: '#e5e5e0'
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #fdfdfb;
        }
        
        .skeleton-bg {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-block {
            @apply bg-gray-200 rounded-DEFAULT relative overflow-hidden;
        }
        
        .skeleton-block::after {
            content: '';
            @apply absolute inset-0 -translate-x-full;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }

    </style>
</head>
<body class="font-body text-foreground antialiased min-h-screen pt-24 pb-16">
<!-- Top Navigation (JSON) -->
<nav class="fixed top-0 w-full z-50 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-[#e5e5e0] dark:border-[#333333] shadow-sm">
<div class="flex justify-between items-center px-8 h-16 max-w-7xl mx-auto">
<div class="flex items-center gap-8">
<a class="text-xl font-black text-[#0a0a0a] dark:text-[#ffffff] tracking-tighter hover:opacity-80 transition-all duration-300" href="#">IdeaForge</a>
<div class="hidden md:flex gap-6 items-center">
<a class="text-[#6c3ce0] font-bold border-b-2 border-[#6c3ce0] pb-1 hover:opacity-80 transition-all duration-300" href="#">Explore</a>
<a class="text-[#555555] dark:text-[#aaaaaa] hover:text-[#6c3ce0] transition-colors duration-300 hover:opacity-80 transition-all duration-300" href="#">Submit Idea</a>
<a class="text-[#555555] dark:text-[#aaaaaa] hover:text-[#6c3ce0] transition-colors duration-300 hover:opacity-80 transition-all duration-300" href="#">Dashboard</a>
<a class="text-[#555555] dark:text-[#aaaaaa] hover:text-[#6c3ce0] transition-colors duration-300 hover:opacity-80 transition-all duration-300" href="#">Categories</a>
</div>
</div>
<div class="flex items-center gap-4">
<button class="px-5 py-2 bg-[#6c3ce0] text-white rounded-full font-label text-sm uppercase tracking-wider hover:bg-[#8b5cf6] transition-colors duration-300 hover:opacity-80 transition-all duration-300">Get Started</button>
</div>
</div>
</nav>
<main class="max-w-7xl mx-auto px-4 md:px-8">
<!-- Breadcrumb Skeleton -->
<div class="flex items-center gap-2 mb-8">
<div class="skeleton-block w-16 h-4 rounded"></div>
<span class="text-foreground-muted text-sm material-symbols-outlined" style="font-size: 16px;">chevron_right</span>
<div class="skeleton-block w-24 h-4 rounded"></div>
<span class="text-foreground-muted text-sm material-symbols-outlined" style="font-size: 16px;">chevron_right</span>
<div class="skeleton-block w-32 h-4 rounded"></div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
<!-- Left Column: Main Content Skeleton -->
<div class="lg:col-span-8 flex flex-col gap-8">
<!-- Header Area -->
<div class="flex flex-col gap-4">
<div class="skeleton-block w-20 h-6 rounded-full"></div> <!-- Badge -->
<div class="flex flex-col gap-2">
<div class="skeleton-block w-full h-12 md:h-16 rounded-lg"></div> <!-- Title Line 1 -->
<div class="skeleton-block w-3/4 h-12 md:h-16 rounded-lg"></div> <!-- Title Line 2 -->
</div>
</div>
<!-- Author Row -->
<div class="flex items-center gap-4 py-4 border-y border-border">
<div class="skeleton-block w-12 h-12 rounded-full"></div> <!-- Avatar -->
<div class="flex flex-col gap-2 flex-grow">
<div class="skeleton-block w-32 h-4 rounded"></div> <!-- Name -->
<div class="skeleton-block w-24 h-3 rounded"></div> <!-- Date -->
</div>
<div class="flex gap-2">
<div class="skeleton-block w-8 h-8 rounded-full"></div> <!-- Action -->
<div class="skeleton-block w-8 h-8 rounded-full"></div> <!-- Action -->
</div>
</div>
<!-- Problem Section -->
<div class="flex flex-col gap-4 mt-4">
<div class="skeleton-block w-1/3 h-6 rounded"></div> <!-- Subheading -->
<div class="flex flex-col gap-3">
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-11/12 h-4 rounded"></div>
<div class="skeleton-block w-4/5 h-4 rounded"></div>
</div>
</div>
<!-- Solution Section -->
<div class="flex flex-col gap-4 mt-6">
<div class="skeleton-block w-1/4 h-6 rounded"></div> <!-- Subheading -->
<!-- Image Placeholder -->
<div class="skeleton-block w-full h-64 md:h-96 rounded-2xl my-4"></div>
<div class="flex flex-col gap-3">
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-10/12 h-4 rounded"></div>
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-5/6 h-4 rounded"></div>
</div>
</div>
<!-- Tags -->
<div class="flex flex-wrap gap-3 mt-8">
<div class="skeleton-block w-16 h-8 rounded-full"></div>
<div class="skeleton-block w-24 h-8 rounded-full"></div>
<div class="skeleton-block w-20 h-8 rounded-full"></div>
<div class="skeleton-block w-28 h-8 rounded-full"></div>
</div>
<!-- Action Bar (Sticky Bottom) -->
<div class="sticky bottom-4 w-full bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-border shadow-sm flex justify-between items-center mt-12">
<div class="flex items-center gap-4">
<div class="skeleton-block w-24 h-10 rounded-full"></div>
<div class="skeleton-block w-10 h-10 rounded-full"></div>
</div>
<div class="skeleton-block w-32 h-10 rounded-full"></div>
</div>
</div>
<!-- Right Column: Sidebar Skeleton -->
<div class="lg:col-span-4 flex flex-col gap-8">
<!-- About Author Card -->
<div class="bg-white rounded-2xl p-6 border border-border shadow-sm">
<div class="skeleton-block w-1/3 h-5 rounded mb-6"></div> <!-- Card Title -->
<div class="flex flex-col items-center text-center gap-4">
<div class="skeleton-block w-20 h-20 rounded-full"></div> <!-- Avatar -->
<div class="skeleton-block w-32 h-5 rounded"></div> <!-- Name -->
<div class="skeleton-block w-full h-3 rounded mt-2"></div> <!-- Bio -->
<div class="skeleton-block w-5/6 h-3 rounded"></div> <!-- Bio -->
<div class="skeleton-block w-full h-10 rounded-full mt-4"></div> <!-- Follow Button -->
</div>
</div>
<!-- Similar Ideas Card -->
<div class="bg-white rounded-2xl p-6 border border-border shadow-sm">
<div class="skeleton-block w-1/2 h-5 rounded mb-6"></div> <!-- Card Title -->
<div class="flex flex-col gap-6">
<!-- Idea Item 1 -->
<div class="flex flex-col gap-2">
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-3/4 h-4 rounded"></div>
<div class="flex justify-between mt-2">
<div class="skeleton-block w-16 h-3 rounded"></div>
<div class="skeleton-block w-12 h-3 rounded"></div>
</div>
</div>
<!-- Idea Item 2 -->
<div class="flex flex-col gap-2">
<div class="skeleton-block w-full h-4 rounded"></div>
<div class="skeleton-block w-4/5 h-4 rounded"></div>
<div class="flex justify-between mt-2">
<div class="skeleton-block w-20 h-3 rounded"></div>
<div class="skeleton-block w-10 h-3 rounded"></div>
</div>
</div>
<!-- Idea Item 3 -->
<div class="flex flex-col gap-2">
<div class="skeleton-block w-11/12 h-4 rounded"></div>
<div class="skeleton-block w-2/3 h-4 rounded"></div>
<div class="flex justify-between mt-2">
<div class="skeleton-block w-14 h-3 rounded"></div>
<div class="skeleton-block w-16 h-3 rounded"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
